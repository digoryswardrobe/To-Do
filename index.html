<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To Do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2ead7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>To Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Literata:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one ruled notebook page per day, week tabs on top, the week's sunflower garden at the foot. */
:root{
  --paper:#f2ead7; --paper-2:#f8f2e2; --ink:#2f2618; --ink-soft:#7d6a4c; --rule:#d6c7a4; --edge:#b79a5a;
  --overlay:rgba(47,38,24,.38); --soil:#8a6a4a; --stem:#4f7a3a; --leaf:#5f8f45; --seed:#5a3818;
  --s1:#D99A00; --s2:#F2B705; --s3:#F7CD3C; --s4:#FBE07A; --s5:#FDF0BE;
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  --text:'Literata',Georgia,'Times New Roman',serif;
  --pitch:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1f1a13; --paper-2:#2a241a; --ink:#eee3c8; --ink-soft:#b3a283; --rule:#3d3428; --edge:#7a6640;
  --overlay:rgba(0,0,0,.55); --soil:#6b513a; --stem:#6f9a52; --leaf:#7fae5e; --seed:#3a2410; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1f1a13; --paper-2:#2a241a; --ink:#eee3c8; --ink-soft:#b3a283; --rule:#3d3428; --edge:#7a6640;
  --overlay:rgba(0,0,0,.55); --soil:#6b513a; --stem:#6f9a52; --leaf:#7fae5e; --seed:#3a2410; color-scheme:dark}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.page{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
.brand{font-size:12px;font-style:italic;color:var(--ink-soft);letter-spacing:.02em}
h1{font-family:var(--hand);font-weight:600;font-size:40px;line-height:1;margin:2px 0 0;text-wrap:balance}
.sub{font-size:13px;font-style:italic;color:var(--ink-soft);margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 6px;border-radius:12px;border:1.5px solid transparent;color:var(--ink-soft)}
.tab .l{font-family:var(--hand);font-size:22px;line-height:1.1}
.tab .n{font-size:11px;font-variant-numeric:tabular-nums}
.tab.today .l{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--s1)}
.tab.on{border-color:var(--ink);color:var(--ink)}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--pitch) - 1px),var(--rule) calc(var(--pitch) - 1px) var(--pitch))}
.list{list-style:none;margin:0;padding:0}
.row{height:var(--pitch);display:flex;align-items:flex-end;gap:6px;padding:0 0 7px;box-sizing:border-box;line-height:1.1}
.row.sortable-ghost{opacity:.35}
.row.sortable-chosen{background:var(--paper-2)}
.ck{width:34px;height:34px;display:grid;place-items:end center;padding-bottom:1px;flex:none;margin-bottom:-4px}
.box{width:19px;height:19px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:14px;line-height:1}
.done .box{background:var(--ink);color:var(--paper)}
.sw{width:20px;height:20px;border-radius:4px;flex:none;border:1px solid var(--edge);margin-bottom:-1px}
.txt{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0 0}
.done .txt{text-decoration:line-through;text-decoration-color:var(--ink-soft);color:var(--ink-soft)}
.tag{font-family:var(--hand);font-size:19px;color:var(--ink-soft);white-space:nowrap;padding:6px 2px 0}
.tag b{font-weight:600;color:var(--ink)}
.icon{width:34px;height:34px;display:grid;place-items:end center;flex:none;color:var(--ink-soft);margin-bottom:-4px}
.icon svg{width:18px;height:18px;margin-bottom:4px}
.grip{cursor:grab;touch-action:none}
.add{height:var(--pitch);display:flex;align-items:flex-end;padding:0 0 6px 6px;font-family:var(--hand);font-size:23px;color:var(--ink-soft);width:100%}
.empty{font-style:italic;color:var(--ink-soft);font-size:14px;height:var(--pitch);display:flex;align-items:flex-end;padding:0 0 9px 6px}
.waiting{font-size:13px;font-style:italic;color:var(--ink-soft)}
.garden{border-top:1.5px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ghead h2{font-family:var(--hand);font-weight:600;font-size:26px;margin:0;line-height:1}
.gnote{font-size:12px;font-style:italic;color:var(--ink-soft)}
.garden svg{width:100%;height:auto;display:block}
.note{font-size:13px;font-style:italic;color:var(--ink-soft);border:1px dashed var(--edge);border-radius:8px;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-size:14px;padding:9px 16px;border-radius:999px;z-index:30;pointer-events:none;transition:opacity .2s}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:20}
.sheet{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:14px;padding:18px 18px 16px;z-index:21;display:flex;flex-direction:column;gap:12px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
.sheet h3{font-family:var(--hand);font-weight:600;font-size:30px;margin:0;line-height:1}
.sheet p{margin:-6px 0 0;font-size:13px;font-style:italic;color:var(--ink-soft)}
.sheet input[type=text]{font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:8px 2px;width:100%;box-sizing:border-box;border-radius:0}
.sheet input[type=text]:focus-visible{outline:none;border-bottom-color:var(--s1)}
.shades{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shades .lab{font-size:12px;font-style:italic;color:var(--ink-soft);width:100%}
.shade{width:40px;height:40px;border-radius:8px;border:1px solid var(--edge);display:grid;place-items:center;color:#2f2618;font-size:15px;font-weight:500}
.shade[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
.opt{display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--rule);font-size:17px;text-align:left;width:100%}
.opt .box{width:24px;height:24px;font-size:16px}
.opt.done .box{background:var(--ink);color:var(--paper-2)}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.primary{font-family:var(--hand);font-size:24px;background:var(--ink);color:var(--paper-2);border-radius:9px;padding:6px 22px;line-height:1.1}
.ghost{font-size:14px;font-style:italic;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:8px 2px}
.danger{color:#a4381f}
:root[data-theme="dark"] .danger{color:#f08a6c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .danger{color:#f08a6c}}
.backup{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.backup label{cursor:pointer}
.err{font-size:13px;color:#a4381f;margin-top:-6px}
</style>
</head>
<body>


<div class="page">
  <header>
    <div class="brand">To Do</div>
    <h1 id="day-name">Today</h1>
    <div class="sub" id="week-label"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Days of the week"></nav>
  <div id="note" class="note" hidden></div>
  <section aria-label="Tasks">
    <div class="ruled">
      <ul class="list" id="list"></ul>
      <button class="add" id="add-btn" type="button">+ add a task</button>
    </div>
    <div class="waiting" id="waiting" hidden></div>
  </section>
  <section class="garden" aria-label="This week's garden">
    <div id="garden"></div>
  </section>
  <footer class="backup">
    <button type="button" class="ghost" id="backup-btn">Save a backup</button>
    <label class="ghost" for="restore-file">Restore a backup</label>
    <input type="file" id="restore-file" accept="application/json,.json" hidden>
  </footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<form class="sheet" id="sheet" hidden autocomplete="off"></form>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(function(){
const DOW=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const LET='MTWTFSS';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CACHE='writers-garden-v1';
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return key(d);};
const monday=k=>{const d=fromKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return key(d);};
const todayKey=()=>key(new Date());
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isWritingText=t=>/^\s*writing\s*$/i.test(t);
const $=id=>document.getElementById(id);

function insertByShade(list,task){
  const i=list.findIndex(x=>x.shade>task.shade);
  if(i<0) list.push(task); else list.splice(i,0,task);
}

/* Roll unfinished tasks forward to today, drop last week, add Writing Mon–Fri once per week. */
function normalize(src){
  const s=JSON.parse(JSON.stringify(src||{}));
  s.v=1; s.tasks=s.tasks||{};
  const t=todayKey(), ws=monday(t);
  const carry=[];
  Object.keys(s.tasks).sort().forEach(k=>{
    if(k>=t) return;
    const keep=[];
    (s.tasks[k]||[]).forEach(x=>{(!x.done&&!x.writing)?carry.push(x):keep.push(x);});
    if(k<ws) delete s.tasks[k]; else s.tasks[k]=keep;
  });
  if(carry.length){const l=s.tasks[t]=s.tasks[t]||[];carry.forEach(x=>insertByShade(l,x));}
  if(s.seeded!==ws){
    for(let i=0;i<5;i++){
      const k=addDays(ws,i), l=s.tasks[k]=s.tasks[k]||[];
      if(!l.some(x=>x.writing)) l.unshift({id:newId(),text:'Writing',shade:1,done:false,writing:true,hours:false,words:false});
    }
    s.seeded=ws;
  }
  return s;
}

let state=normalize(readCache());
let selected=todayKey();
let lastDay=todayKey();
let doc=null, loaded=false, lastSaved='', saveTimer=null, chain=Promise.resolve();

function readCache(){try{const r=localStorage.getItem(CACHE);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeCache(){try{localStorage.setItem(CACHE,JSON.stringify(state));}catch(e){}}

function commit(){
  render(); writeCache();
  if(!loaded||!doc) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,400);
}
function flush(){
  saveTimer=null;
  const body=JSON.stringify(state);
  if(body===lastSaved) return;
  lastSaved=body;
  chain=chain.then(()=>doc.set(JSON.parse(body))).then(()=>hideNote('save')).catch(()=>{
    lastSaved='';
    showNote("Couldn't save to your account just now. Your changes are kept on this phone and will save with your next change.",'save');
  });
}

let noteKind=null;
function showNote(msg,kind){const n=$('note');n.textContent=msg;n.hidden=false;noteKind=kind;}
function hideNote(kind){if(!kind||noteKind===kind){$('note').hidden=true;noteKind=null;}}

let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},1800);}

function dayList(k){return state.tasks[k]=state.tasks[k]||[];}
function findTask(id){const l=dayList(selected);return {l,i:l.findIndex(x=>x.id===id)};}
function bloomOf(k){
  const w=(state.tasks[k]||[]).filter(x=>x.writing&&x.done);
  return {wrote:w.length>0,hours:w.some(x=>x.hours),words:w.some(x=>x.words)};
}

/* ---------- rendering ---------- */
const ICON_MOVE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
const ICON_GRIP='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>';

function render(){
  const t=todayKey(), ws=monday(t);
  const d=fromKey(selected);
  $('day-name').textContent=DOW[(d.getDay()+6)%7]+(selected===t?'':'');
  const m=fromKey(ws);
  $('week-label').textContent=MONTHS[d.getMonth()]+' '+d.getDate();

  let tabs='';
  for(let i=0;i<7;i++){
    const k=addDays(ws,i), dd=fromKey(k);
    tabs+='<button type="button" class="tab'+(k===selected?' on':'')+(k===t?' today':'')+'" data-day="'+k+'" aria-pressed="'+(k===selected)+'" aria-label="'+DOW[i]+' '+MONTHS[dd.getMonth()]+' '+dd.getDate()+'"><span class="l">'+LET[i]+'</span></button>';
  }
  $('tabs').innerHTML=tabs;

  const list=dayList(selected);
  $('list').innerHTML=list.length?list.map(x=>{
    const tag=x.writing&&x.done?'<button type="button" class="tag" data-act="write" data-id="'+x.id+'" aria-label="Writing goals">'+(x.hours?'<b>3h</b>':'—')+' · '+(x.words?'<b>500w</b>':'—')+'</button>':'';
    const move=x.writing?'':'<button type="button" class="icon" data-act="move" data-id="'+x.id+'" aria-label="Move to the next day">'+ICON_MOVE+'</button>';
    return '<li class="row'+(x.done?' done':'')+'" data-id="'+x.id+'">'+
      '<button type="button" class="ck" data-act="toggle" data-id="'+x.id+'" aria-label="'+(x.done?'Mark not done':'Mark done')+': '+esc(x.text)+'"><span class="box">'+(x.done?'✓':'')+'</span></button>'+
      '<span class="sw" style="background:var(--s'+x.shade+')"></span>'+
      '<button type="button" class="txt" data-act="edit" data-id="'+x.id+'">'+esc(x.text)+'</button>'+tag+move+
      '<span class="icon grip" aria-label="Drag to reorder">'+ICON_GRIP+'</span></li>';
  }).join(''):'';

  const nextMon=addDays(ws,7), waiting=(state.tasks[nextMon]||[]).length;
  const w=$('waiting');
  if(selected===addDays(ws,6)&&waiting){w.hidden=false;w.textContent=waiting+(waiting===1?' task is':' tasks are')+' waiting for next Monday.';}else w.hidden=true;

  renderGarden(ws,t);
}

function flower(x,ground,b,future){
  const S=1.55, ox=x-15*S, oy=ground-42*S;
  let g='<g transform="translate('+ox.toFixed(1)+' '+oy.toFixed(1)+') scale('+S+')">';
  g+='<ellipse cx="15" cy="42" rx="12" ry="3" fill="var(--soil)"'+(future?' opacity=".45"':'')+'/>';
  const wrote=b.wrote||b.hours||b.words;
  if(wrote) g+='<path d="M15 41 C14.5 32 15.5 22 15 14" stroke="var(--stem)" stroke-width="2" fill="none" stroke-linecap="round"/>';
  if(wrote&&b.hours) g+='<path d="M15 31 C10 27 6 28 3.5 31 C8 34 12 34 15 31Z M15 24.5 C20 20.5 24 21.5 26.5 24.5 C22 27.5 18 27.5 15 24.5Z" fill="var(--leaf)"/>';
  if(wrote&&b.words){
    for(let i=0;i<12;i++) g+='<ellipse cx="15" cy="4.5" rx="2.4" ry="5.2" fill="'+(i%2?'#D99A00':'#F2B705')+'" transform="rotate('+(i*30)+' 15 12)"/>';
    g+='<circle cx="15" cy="12" r="4.4" fill="#5a3818"/><circle cx="15" cy="12" r="2.6" fill="#3d240f"/>';
  } else if(wrote&&b.hours){
    [-60,-36,-12,12,36,60].forEach((a,i)=>{g+='<ellipse cx="15" cy="6.6" rx="1.8" ry="3.8" fill="'+(i%2?'#D99A00':'#F2B705')+'" transform="rotate('+a+' 15 12.5)"/>';});
    g+='<path d="M10.4 12.6 C10.4 17.6 19.6 17.6 19.6 12.6 C18 10.6 12 10.6 10.4 12.6Z" fill="var(--leaf)"/><path d="M11.6 11.8 L13 14.4 M18.4 11.8 L17 14.4" stroke="var(--stem)" stroke-width=".8" stroke-linecap="round"/>';
  } else if(wrote) g+='<ellipse cx="15" cy="13" rx="3.2" ry="4.2" fill="var(--leaf)"/><path d="M12.6 11 Q15 6.8 17.4 11" fill="#F2B705"/>';
  return g+'</g>';
}

function renderGarden(ws,t){
  const W=350,ground=118;
  let full=0, svg='';
  for(let i=0;i<7;i++){
    const k=addDays(ws,i), b=bloomOf(k), x=25+i*50;
    if(b.wrote||b.hours||b.words) full++; if(b.hours) full++; if(b.words) full++;
    svg+=flower(x,ground,b,k>t);
    svg+='<text x="'+x+'" y="140" text-anchor="middle" font-family="Caveat, cursive" font-size="17" font-weight="600" fill="'+(k===t?'var(--ink)':'var(--ink-soft)')+'">'+LET[i]+'</text>';
  }
  let extras='';
  if(full>=12){
    let rays='';for(let i=0;i<12;i++){const a=i*Math.PI/6;rays+='<line x1="'+(318+Math.cos(a)*17).toFixed(1)+'" y1="'+(26+Math.sin(a)*17).toFixed(1)+'" x2="'+(318+Math.cos(a)*24).toFixed(1)+'" y2="'+(26+Math.sin(a)*24).toFixed(1)+'" stroke="#D99A00" stroke-width="2" stroke-linecap="round"/>';}
    extras+='<g>'+rays+'<circle cx="318" cy="26" r="13" fill="#F2B705"/></g>';
  }
  if(full>=9){
    extras+='<path d="M60 40 C95 10 130 52 165 28 S225 18 238 30" fill="none" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 4"/>'+
      '<g transform="translate(250 30)"><ellipse cx="-3" cy="-7" rx="5" ry="7" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1" transform="rotate(-25 -3 -7)"/><ellipse cx="4" cy="-7" rx="5" ry="7" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1" transform="rotate(25 4 -7)"/>'+
      '<ellipse cx="0" cy="0" rx="10" ry="7" fill="#F2B705" stroke="#2f2618" stroke-width="1"/><path d="M-3 -6.5 V6.5 M3 -6 V6" stroke="#2f2618" stroke-width="2.4"/><circle cx="10" cy="0" r="3.5" fill="#2f2618"/></g>';
  }
  $('garden').innerHTML='<svg viewBox="0 0 '+W+' 150" role="img" aria-label="'+full+' of 21 garden points this week, bee at 9, sun at 12">'+extras+svg+'</svg>';
}

/* ---------- sheets ---------- */
let sheetMode=null, sheetId=null, sheetShade=3, deleteArmed=false, sheetW=null;
function openSheet(html){$('sheet').innerHTML=html;$('sheet').hidden=false;$('scrim').hidden=false;}
function closeSheet(){$('sheet').hidden=true;$('scrim').hidden=true;sheetMode=null;sheetId=null;deleteArmed=false;}
function shadeButtons(){
  let h='<div class="shades" role="group" aria-label="Priority shade"><span class="lab">Shade: darkest is most important</span>';
  for(let s=1;s<=5;s++) h+='<button type="button" class="shade" data-shade="'+s+'" style="background:var(--s'+s+')" aria-pressed="'+(s===sheetShade)+'" aria-label="Priority '+s+(s===1?' (highest)':s===5?' (lowest)':'')+'">'+s+'</button>';
  return h+'</div>';
}
function openAdd(){
  sheetMode='add'; sheetShade=3;
  openSheet('<h3>New task</h3><input type="text" id="task-text" placeholder="What needs doing?" maxlength="120" aria-label="Task">'+
    '<div class="err" id="err" hidden>Write the task first.</div>'+shadeButtons()+
    '<div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button type="submit" class="primary">Add</button></div>');
  setTimeout(()=>{const i=$('task-text');if(i)i.focus();},60);
}
function openEdit(id){
  const {l,i}=findTask(id); if(i<0) return; const x=l[i];
  sheetMode='edit'; sheetId=id; sheetShade=x.shade; deleteArmed=false;
  openSheet('<h3>Edit task</h3><input type="text" id="task-text" maxlength="120" aria-label="Task" value="'+esc(x.text)+'">'+
    '<div class="err" id="err" hidden>Write the task first.</div>'+shadeButtons()+
    '<div class="actions"><button type="button" class="ghost danger" id="del-btn" data-act="delete">Delete task</button><button type="submit" class="primary">Save</button></div>');
}
function openWriting(id){
  const {l,i}=findTask(id); if(i<0) return; const x=l[i];
  sheetMode='write'; sheetId=id; sheetW={hours:!!x.hours,words:!!x.words};
  drawWriting();
}
function drawWriting(){
  openSheet('<h3>How did it go?</h3><p>Tick what you reached today.</p>'+
    '<button type="button" class="opt'+(sheetW.hours?' done':'')+'" data-act="goal" data-goal="hours" aria-pressed="'+sheetW.hours+'"><span class="box">'+(sheetW.hours?'✓':'')+'</span>3 hours</button>'+
    '<button type="button" class="opt'+(sheetW.words?' done':'')+'" data-act="goal" data-goal="words" aria-pressed="'+sheetW.words+'"><span class="box">'+(sheetW.words?'✓':'')+'</span>500 words</button>'+
    '<div class="actions"><button type="button" class="ghost" data-act="unwrite">I didn\'t write today</button><button type="submit" class="primary">Done</button></div>');
}

$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.shade){sheetShade=+b.dataset.shade;$('sheet').querySelectorAll('.shade').forEach(s=>s.setAttribute('aria-pressed',String(+s.dataset.shade===sheetShade)));return;}
  const act=b.dataset.act;
  if(act==='close'){closeSheet();}
  else if(act==='goal'){sheetW[b.dataset.goal]=!sheetW[b.dataset.goal];drawWriting();}
  else if(act==='unwrite'){const {l,i}=findTask(sheetId);if(i>=0){l[i].done=false;l[i].hours=false;l[i].words=false;}closeSheet();commit();}
  else if(act==='delete'){
    if(!deleteArmed){deleteArmed=true;b.textContent='Tap again to delete';return;}
    const {l,i}=findTask(sheetId);if(i>=0)l.splice(i,1);closeSheet();commit();toast('Task deleted');
  }
});
$('sheet').addEventListener('input',e=>{if(e.target.id==='task-text'){$('err').hidden=true;}});
$('sheet').addEventListener('submit',e=>{
  e.preventDefault();
  if(sheetMode==='write'){
    const {l,i}=findTask(sheetId);
    if(i>=0){l[i].done=true;l[i].hours=sheetW.hours;l[i].words=sheetW.words;}
    closeSheet();commit();return;
  }
  const text=($('task-text').value||'').trim();
  if(!text){$('err').hidden=false;$('task-text').focus();return;}
  if(sheetMode==='add'){
    insertByShade(dayList(selected),{id:newId(),text,shade:sheetShade,done:false,writing:isWritingText(text),hours:false,words:false});
  } else if(sheetMode==='edit'){
    const {l,i}=findTask(sheetId);
    if(i>=0){l[i].text=text;l[i].shade=sheetShade;}
  }
  closeSheet();commit();
});
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();});

/* ---------- list actions ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;selected=b.dataset.day;render();});
$('add-btn').addEventListener('click',openAdd);
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const id=b.dataset.id, {l,i}=findTask(id); if(i<0) return; const x=l[i];
  const act=b.dataset.act;
  if(act==='toggle'){
    if(x.writing){openWriting(id);return;}
    x.done=!x.done; commit();
  } else if(act==='write'){openWriting(id);}
  else if(act==='edit'){openEdit(id);}
  else if(act==='move'){
    l.splice(i,1); x.done=false;
    const next=addDays(selected,1);
    insertByShade(dayList(next),x); commit();
    const ws=monday(todayKey());
    toast(next>=addDays(ws,7)?'Moved to next Monday':'Moved to '+DOW[(fromKey(next).getDay()+6)%7]);
  }
});
if(window.Sortable){
  Sortable.create($('list'),{handle:'.grip',animation:150,draggable:'.row',
    onEnd:()=>{
      const ids=[...$('list').querySelectorAll('.row')].map(r=>r.dataset.id);
      const l=dayList(selected), byId=Object.fromEntries(l.map(x=>[x.id,x]));
      state.tasks[selected]=ids.map(id=>byId[id]).filter(Boolean);
      commit();
    }});
}

/* New day: roll tasks forward and, on Monday, start a fresh week. */
function checkDay(){
  const t=todayKey(); if(t===lastDay) return;
  if(selected===lastDay||selected<monday(t)) selected=t;
  lastDay=t; state=normalize(state); commit();
}
setInterval(checkDay,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});

render();

/* ---------- on-device storage + backup ---------- */
loaded=true;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
$('backup-btn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='to-do-backup-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup saved');
});
$('restore-file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.tasks!=='object')throw 0;state=normalize(d);selected=todayKey();commit();toast('Backup restored');}
    catch(err){toast("That file isn't a To Do backup");}};
  r.readAsText(f); e.target.value='';
});
})();
</script>

</body>
</html>
